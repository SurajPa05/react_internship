<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            scroll-behavior: smooth;

        }

        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;

        }
        button{
            height: 4rem;
            width: 9rem;
            background-color: rgb(61, 158, 255);
            color: white;
            font-size: large;
            border-radius: 1rem;
            border: 1px solid rgb(0, 170, 255);
        }

    </style>
</head>
<body>
    <h1 id="heading">Click to know you future</h1>
    <button id="btn" onclick="printMsg()">Click me</button>
</body>

    <script>
        let printMsg = () =>{
            console.log("Button pressed");
            document.getElementById("heading").innerHTML = "Calculating possible futures"
            document.getElementById("btn").style.display = "none"
            setTimeout(() => {
                document.getElementById("heading").innerHTML = "You don't have a future"
            }, 100000);
        } 

    </script>
</html>
